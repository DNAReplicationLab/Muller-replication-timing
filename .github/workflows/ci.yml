name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Nextflow
        run: |
          curl -s https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/

      - name: Check the workflow parses and the help text renders
        run: nextflow run main.nf --help

      - name: Validate the bundled samplesheets
        run: python3 bin/validate_samplesheet.py
            --samplesheet assets/samplesheet_muller2014.csv
            --comparisons assets/comparisons_muller2014.csv

      - name: Shellcheck the helper scripts
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck bin/*.sh tests/*.sh

      # The decoder is the one place this pipeline reimplements something a standard
      # tool would otherwise do, so it is checked against that tool's own output.
      - name: Colourspace decoder matches NCBI base-space conversion
        run: bash tests/test_decode_colourspace.sh SRR616663 5000
